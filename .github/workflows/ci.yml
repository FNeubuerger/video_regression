name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install lint tools (dev group only)
        run: uv sync --locked --only-group dev
      - name: Black
        run: uv run --no-sync black --check .
      - name: isort
        run: uv run --no-sync isort --check-only .
      - name: Flake8
        run: uv run --no-sync flake8 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked
      - name: Lockfile and requirements.txt are in sync
        run: |
          uv export --locked --no-hashes --no-dev --group xai --format requirements-txt -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
      - name: Run unit tests
        run: uv run --no-sync pytest -q tests
