name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 isort==5.13.2 flake8==7.1.1 pytest

      - name: Black
        run: black --check --line-length=88 .

      - name: isort
        run: isort --check-only --profile=black --line-length=88 .

      - name: Flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503,E501 .

      - name: Install minimal runtime deps for tests
        run: |
          pip install -r requirements.txt || true
          pip install pytest numpy

      - name: Run unit tests
        run: |
          if [ -d tests ]; then pytest -q tests || true; fi
