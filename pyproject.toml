[project]
name = "video-regression"
version = "0.1.0"
description = "Ultrasound-video temperature estimation for microwave ablation monitoring (CNN-LSTM, physics-informed, Bayesian, KAN, LTC models)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Felix Neubuerger" }, { name = "Helena Nawrath" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch is pinned to the minor version all committed checkpoints were trained with.
    "torch==2.8.*",
    "torchvision==0.23.*",
    "torchbnn>=1.2",
    "ncps>=1.0.1",
    "numpy>=1.26",
    "scipy>=1.16",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "scikit-image>=0.26",
    "opencv-python>=4.12",
    "pillow>=11.3",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "adjusttext>=1.3",
    "tqdm>=4.67",
    "wandb>=0.23",
    "onnx>=1.20",
    "onnxruntime>=1.23",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "black==24.8.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "pre-commit>=4.0",
]
xai = [
    "captum>=0.8",
    "quantus>=0.6",
]

[tool.uv]
# Research codebase of scripts, not an installable package.
package = false
default-groups = ["dev", "xai"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
# Explicit so local untracked dirs (e.g. wandb/ run logs) don't change the result.
known_first_party = ["benchmarks", "demo", "evaluation", "models", "physics",
  "simulation", "training", "utils", "validation"]
known_third_party = ["wandb"]

[tool.pytest.ini_options]
# Scripts import top-level packages (physics, models, ...) from the repo root.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
